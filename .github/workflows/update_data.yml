name: Daily Numbers3 Update

on:
  schedule:
    # 毎日 日本時間 20:30 (UTC 11:30) に実行
    - cron: '30 11 * * *'
  workflow_dispatch: # 手動で「今すぐ実行」ボタンを出す設定

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # これが書き込み許可になります
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run update
        run: python auto_update.py
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add numbers3_clean.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data" && git push)
